name: tf-env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch=2.1.*
  - torchvision=0.16.*
  - torchaudio=2.1.*
  - pytorch-cuda=12.1
  - pandas=1.3.5
  - spacy=3.2.*
  - altair=4.1.*
  - jupytext=1.13.*
  - flake8
  - black
  - gputil
  - pip
  - pip:
      - torchdata>=0.7.0
      - torchtext>=0.16.0
      - wandb
      - matplotlib