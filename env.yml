name: tf-env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1  # 兼容您本机的 CUDA 12.0
  - pandas=1.3.5
  - spacy=3.2.*
  - altair=4.1.*
  - jupytext=1.13.*
  - flake8
  - black
  - gputil
  - pip
  - pip:
      - torchdata==0.3.0
      - torchtext==0.12
      - wandb
